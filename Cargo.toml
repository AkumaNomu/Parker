[package]
name = "parker"
version = "0.6.1"
edition = "2021"
authors = ["Akuma Nomu"]
description = "A desktop capture utility for smart OCR, QR actions, and region video recording"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
keywords = ["screen-recording", "ocr", "qrcode", "clipboard", "linux"]
categories = ["multimedia::video", "multimedia::images"]
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
rqrr = { version = "0.10.1", default-features = false, features = ["img"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
inquire = "0.6"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
