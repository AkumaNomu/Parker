name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Install Rust
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - name: Verify release tag
        shell: powershell
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^\"]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag does not match Cargo version" }
      - name: Build Windows package
        shell: powershell
        run: .\scripts\package-release.ps1
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-release
          path: release/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Verify release tag
        run: test "v$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -1)" = "$GITHUB_REF_NAME"
      - name: Build Linux package
        run: ./scripts/package-release-linux.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-release
          path: release/*

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.0
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.1
        with:
          files: release/*
          generate_release_notes: true
